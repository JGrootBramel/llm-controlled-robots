[pytest]
testpaths = tests/unit tests/ros_graph tests/rosa tests/e2e
pythonpath =
    .
    src
markers =
    unit: Fast tests using ROS stubs (default CI)
    ros_graph: Real rospy against a running roscore
    rosa: jpl-rosa agent loads limo_llm_control.tools (mocked LLM)
    e2e: Integration smoke; requires RUN_E2E=1 and full ROS env
# /opt/ros/galactic ships a pytest plugin that is incompatible with
# pytest >= 8 (import_path signature changed). Disable it here so users
# don't need to set PYTEST_DISABLE_PLUGIN_AUTOLOAD manually.
addopts = -p no:launch -p no:launch_ros -p no:ament_flake8 -p no:ament_copyright -p no:ament_xmllint -p no:ament_lint -p no:ament_pep257
