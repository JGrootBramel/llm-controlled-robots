[pytest]
testpaths = tests/unit tests/ros_graph tests/rosa tests/e2e
pythonpath =
    .
    src
markers =
    unit: Fast tests using ROS stubs (default CI)
    ros_graph: Real rospy against a running roscore
    rosa: jpl-rosa agent loads limo_llm_control.tools (mocked LLM)
    e2e: Integration smoke; requires RUN_E2E=1 and full ROS env
